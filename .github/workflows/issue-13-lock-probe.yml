name: Temporary TFJS 4.22 lock probe
on:
  push:
    branches:
      - fix/issue-13-tfjs-4-22
permissions:
  contents: read
jobs:
  lock:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Generate npm-verified dependency lock
        shell: pwsh
        run: |
          $config = Get-Content -Raw -Encoding UTF8 dependencies.json | ConvertFrom-Json
          ($config.dependencies | Where-Object id -eq 'tfjs').version = '4.22.0'
          $config | ConvertTo-Json -Depth 30 | Set-Content -Encoding utf8 dependencies.json
          ./scripts/sync-dependency-lock.ps1 -ForceDownload
          Write-Host "LOCK_JSON_BEGIN"
          Get-Content -Raw -Encoding UTF8 dependencies.lock.json
          Write-Host "LOCK_JSON_END"
